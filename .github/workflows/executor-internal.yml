# stage-cloud-34 — Internal Executor 真实服务（plan §63/§64/§92/§93）
# outbound-only（§4）：GitHub-hosted runner 出站 HTTPS 轮询中央平台，
# 无任何入站端口。错峰短窗口控制 Actions 免费额度（§12 预算意识）。
name: executor-internal
on:
  schedule:
    - cron: "7 */2 * * *"   # 每 2 小时的第 7 分钟启动，运行约 20 分钟
  workflow_dispatch: {}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run internal executor
        working-directory: cloudflare/executor
        run: |
          export CENTRAL_URL="${{ secrets.CENTRAL_URL }}"
          export EXECUTOR_ID="exec-internal-01"
          export EXECUTION_PATH="internal"
          export EXECUTOR_TOKEN="${{ secrets.EXECUTOR_TOKEN_INTERNAL }}"
          export EXECUTOR_CAPABILITIES="demo"
          export POLL_INTERVAL_S="10"
          export HEARTBEAT_INTERVAL_S="25"
          # 短窗口常驻：到时优雅退出（下次调度再上线）
          timeout 1200 python agent/main.py --runner demo || true
