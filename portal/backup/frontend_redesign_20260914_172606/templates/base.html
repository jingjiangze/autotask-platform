<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ site.site_title or '资源分享' }}{% endblock %} · {{ site.site_title or '资源分享' }}</title>
<meta name="description" content="{{ site.seo_description or site.site_description or '' }}">
{% if site.seo_keywords %}<meta name="keywords" content="{{ site.seo_keywords }}">{% endif %}
<meta name="robots" content="index,follow">
<meta property="og:title" content="{{ site.site_title or '资源分享' }}">
<meta property="og:description" content="{{ site.seo_description or site.site_description or '' }}">
<meta property="og:type" content="website">
{% if site.favicon %}<link rel="icon" href="{{ site.favicon }}">{% endif %}
<link rel="stylesheet" href="{{ url_for('static', filename='portal.css') }}">
{% if site.main_color %}<style>:root{--brand:{{ site.main_color }};}</style>{% endif %}
</head>
<body>
<div class="nav">
  <div class="wrap">
    <a class="brand" href="{{ url_for('public.index') }}">
      {% if site.logo %}<img src="{{ site.logo }}" alt="">{% endif %}
      <span>{{ site.site_title or '资源分享' }}</span>
    </a>
    <nav class="links">
      <a href="{{ url_for('public.index') }}">首页</a>
      <a href="{{ url_for('public.categories') }}">分类</a>
      <a href="{{ url_for('public.resources') }}">资源</a>
      <form action="{{ url_for('public.search') }}" method="get">
        <input type="text" name="q" placeholder="搜索资源…" value="{{ q or '' }}"
               style="width:180px;padding:7px 11px;font-size:14px">
      </form>
      {% if is_admin %}<a href="{{ url_for('admin.dashboard') }}">后台</a>{% endif %}
    </nav>
  </div>
</div>

<div class="wrap">
  {% block content %}{% endblock %}
</div>

<div class="foot">
  <div class="wrap">
    {{ site.footer or '' }}
    <div class="small" style="margin-top:6px">
      文件由 OpenList 提供 ·
      <a href="{{ site.openlist_public_base or '#' }}" rel="noopener">进入文件库</a>
    </div>
  </div>
</div>
</body>
</html>
